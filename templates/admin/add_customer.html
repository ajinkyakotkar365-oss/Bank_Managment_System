{% extends 'base.html' %}

{% block title %}Add Customer - Ajinkya Bank{% endblock %}

{% block content %}
<div class="page-title-box">
    <div>
        <h2 class="page-title">Add Customer</h2>
        <p class="breadcrumb">Dashboard <span>/</span> Customers <span>/</span> Add Customer</p>
    </div>
    <a href="{{ url_for('admin_customers') }}" class="btn btn-secondary">
        <i class="fa-solid fa-arrow-left"></i> Back to List
    </a>
</div>

<div class="card" style="max-width: 900px; margin: 0 auto;">
    <div class="card-title">
        <span>Create Customer Profile</span>
    </div>
    
    <form action="{{ url_for('admin_add_customer') }}" method="POST">
        <h4 style="font-size: 14px; font-weight: 600; color: var(--primary-color); margin-bottom: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px;">Account Credentials</h4>
        
        <div class="form-grid" style="margin-bottom: 24px;">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" name="username" id="username" class="form-control" placeholder="e.g. amit_verma" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" class="form-control" placeholder="Minimum 6 characters" required>
            </div>
        </div>

        <h4 style="font-size: 14px; font-weight: 600; color: var(--primary-color); margin-bottom: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px;">Personal Information</h4>
        
        <div class="form-grid" style="margin-bottom: 24px;">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" name="name" id="name" class="form-control" placeholder="Enter customer full name" required>
            </div>
            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" name="dob" id="dob" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="gender">Gender</label>
                <select name="gender" id="gender" class="form-control" required>
                    <option value="" disabled selected>Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label for="mobile">Mobile Number</label>
                <input type="tel" name="mobile" id="mobile" class="form-control" placeholder="10-digit mobile" pattern="[0-9]{10}" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" name="email" id="email" class="form-control" placeholder="name@example.com" required>
            </div>
            <div class="form-group">
                <label for="aadhaar">Aadhaar Number</label>
                <input type="text" name="aadhaar" id="aadhaar" class="form-control" placeholder="12-digit UID" pattern="[0-9]{4}-[0-9]{4}-[0-9]{4}|[0-9]{12}" required>
            </div>
            <div class="form-group">
                <label for="pan">PAN Number</label>
                <input type="text" name="pan" id="pan" class="form-control" placeholder="10-digit alphanumeric" pattern="[A-Z]{5}[0-9]{4}[A-Z]{1}" required style="text-transform: uppercase;">
            </div>
            <div class="form-group form-group-full">
                <label for="address">Full Residential Address</label>
                <input type="text" name="address" id="address" class="form-control" placeholder="Flat/House no, Street, Locality, City, PIN" required>
            </div>
        </div>

        <h4 style="font-size: 14px; font-weight: 600; color: var(--primary-color); margin-bottom: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px;">Banking Settings</h4>
        
        <div class="form-grid">
            <div class="form-group">
                <label for="branch_id">Assign Branch</label>
                <select name="branch_id" id="branch_id" class="form-control" required>
                    <option value="" disabled selected>Select Branch</option>
                    {% for branch in branches %}
                        <option value="{{ branch.id }}">{{ branch.name }} (IFSC: {{ branch.ifsc_code }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="opening_balance">Opening Balance (₹)</label>
                <input type="number" step="0.01" min="0" name="opening_balance" id="opening_balance" class="form-control" placeholder="0.00" value="0.00" required>
            </div>
        </div>

        <div class="form-footer">
            <a href="{{ url_for('admin_customers') }}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Save Customer</button>
        </div>
    </form>
</div>
{% endblock %}
