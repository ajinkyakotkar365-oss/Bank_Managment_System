{% extends 'base.html' %}

{% block title %}Add Employee - Ajinkya Bank{% endblock %}

{% block content %}
<div class="page-title-box">
    <div>
        <h2 class="page-title">Add Employee</h2>
        <p class="breadcrumb">Dashboard <span>/</span> Employees <span>/</span> Add Employee</p>
    </div>
    <a href="{{ url_for('admin_employees') }}" class="btn btn-secondary">
        <i class="fa-solid fa-arrow-left"></i> Back to List
    </a>
</div>

<div class="card" style="max-width: 800px; margin: 0 auto;">
    <div class="card-title">
        <span>Create Employee Profile</span>
    </div>
    
    <form action="{{ url_for('admin_add_employee') }}" method="POST">
        <h4 style="font-size: 14px; font-weight: 600; color: var(--primary-color); margin-bottom: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px;">Account Credentials</h4>
        
        <div class="form-grid" style="margin-bottom: 24px;">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" name="username" id="username" class="form-control" placeholder="e.g. neha_gupta" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" class="form-control" placeholder="Minimum 6 characters" required>
            </div>
        </div>

        <h4 style="font-size: 14px; font-weight: 600; color: var(--primary-color); margin-bottom: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px;">Employee Details</h4>
        
        <div class="form-grid">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" name="name" id="name" class="form-control" placeholder="Enter full name" required>
            </div>
            <div class="form-group">
                <label for="role">Select Role</label>
                <select name="role" id="role" class="form-control" required>
                    <option value="" disabled selected>Select Role</option>
                    <option value="Manager">Manager</option>
                    <option value="Teller">Teller</option>
                    <option value="Loan Officer">Loan Officer</option>
                </select>
            </div>
            <div class="form-group">
                <label for="branch_id">Assign Branch</label>
                <select name="branch_id" id="branch_id" class="form-control" required>
                    <option value="" disabled selected>Select Branch</option>
                    {% for branch in branches %}
                        <option value="{{ branch.id }}">{{ branch.name }} ({{ branch.branch_code }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="mobile">Mobile Number</label>
                <input type="tel" name="mobile" id="mobile" class="form-control" placeholder="10-digit mobile" pattern="[0-9]{10}" required>
            </div>
            <div class="form-group form-group-full">
                <label for="email">Email Address</label>
                <input type="email" name="email" id="email" class="form-control" placeholder="name@bank.com" required>
            </div>
        </div>

        <div class="form-footer">
            <a href="{{ url_for('admin_employees') }}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Save Employee</button>
        </div>
    </form>
</div>
{% endblock %}
