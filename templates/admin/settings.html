{% extends 'base.html' %}

{% block title %}Settings - Bank Management System{% endblock %}

{% block content %}
<div class="page-title-box">
    <div>
        <h2 class="page-title">System Settings</h2>
        <p class="breadcrumb">Dashboard <span>/</span> Settings</p>
    </div>
</div>

<div class="card" style="max-width: 800px; margin: 0 auto; padding: 32px;">
    <div class="card-title" style="margin-bottom: 24px; border-bottom: 1px solid var(--border-color); padding-bottom: 16px;">
        <i class="fa-solid fa-gears" style="color: var(--primary-color);"></i> Banking System Configuration
    </div>
    
    <form action="{{ url_for('settings') }}" method="POST">
        <h4 style="font-size: 14px; font-weight: 600; color: var(--primary-color); margin-bottom: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px;">General Information</h4>
        
        <div class="form-grid" style="margin-bottom: 24px;">
            <div class="form-group">
                <label for="bank_name">Bank Name</label>
                <input type="text" id="bank_name" class="form-control" value="Ajinkya Bank" required>
            </div>
            
            <div class="form-group">
                <label for="currency">Base Currency</label>
                <select id="currency" class="form-control">
                    <option value="INR" selected>Indian Rupee (₹)</option>
                    <option value="USD">US Dollar ($)</option>
                    <option value="EUR">Euro (€)</option>
                </select>
            </div>
        </div>
        
        <h4 style="font-size: 14px; font-weight: 600; color: var(--primary-color); margin-bottom: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px;">Interest Rates (%)</h4>
        
        <div class="form-grid" style="margin-bottom: 24px;">
            <div class="form-group">
                <label for="savings_rate">Savings Account Interest Rate</label>
                <input type="number" step="0.01" id="savings_rate" class="form-control" value="3.00" required>
            </div>
            
            <div class="form-group">
                <label for="fd_rate">Fixed Deposit Interest Rate</label>
                <input type="number" step="0.01" id="fd_rate" class="form-control" value="6.50" required>
            </div>
        </div>
        
        <h4 style="font-size: 14px; font-weight: 600; color: var(--primary-color); margin-bottom: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px;">System Security</h4>
        
        <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 32px;">
            <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; color: var(--text-secondary);">
                <input type="checkbox" checked style="width: 16px; height: 16px; accent-color: var(--primary-color);"> Enable Multi-Factor Authentication (MFA)
            </label>
            <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; color: var(--text-secondary);">
                <input type="checkbox" checked style="width: 16px; height: 16px; accent-color: var(--primary-color);"> Enforce Automatic Session Timeout (15 minutes)
            </label>
            <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; color: var(--text-secondary);">
                <input type="checkbox" style="width: 16px; height: 16px; accent-color: var(--primary-color);"> Enable Daily Transactions Limit Alerts
            </label>
        </div>
        
        <div class="form-footer">
            <button type="submit" class="btn btn-primary" style="display: inline-flex; align-items: center; gap: 8px;">
                <i class="fa-solid fa-circle-check"></i> Save Settings
            </button>
        </div>
    </form>
</div>
{% endblock %}
